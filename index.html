<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#16202E; --ink-soft:#2A3848; --surface:#EEF0F3; --card:#fff;
    --red:#C8362F; --amber:#FFC02E; --amber-deep:#E5A800; --muted:#6A7686; --line:#D8DCE2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--surface); font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--ink);}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 48px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:20px 0 18px;}
  .brand{display:flex; align-items:center; gap:11px;}
  .logo{width:40px; height:40px; border-radius:10px; background:var(--red); display:flex; align-items:center; justify-content:center;}
  .brand h1{font-family:Oswald,sans-serif; font-weight:700; font-size:22px; margin:0; line-height:1;}
  .brand p{font-size:12px; color:var(--muted); margin:2px 0 0;}
  .mode-btn{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .voice-panel{background:var(--ink); border-radius:16px; padding:22px 18px 20px; margin-bottom:18px; text-align:center; position:relative;}
  .toggles{position:absolute; top:12px; right:12px; display:flex; gap:6px;}
  .tg{background:rgba(255,255,255,.08); border:none; border-radius:9px; padding:8px; cursor:pointer; color:#cfd6df; display:flex;}
  .mic{width:84px; height:84px; border-radius:50%; border:none; cursor:pointer; background:var(--amber); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -10px rgba(0,0,0,.55);}
  .mic.live{background:var(--red); color:#fff; animation:pulse 1.3s ease-in-out infinite;}
  .mic[disabled]{cursor:not-allowed; opacity:.7;}
  .vp-title{color:#fff; font-family:Oswald,sans-serif; font-size:17px; margin:14px 0 2px;}
  .vp-sub{color:#9AA6B5; font-size:13px; margin:0;}
  .hf-btn{margin-top:14px; font-size:12.5px; font-weight:600; color:#cfd6df; background:rgba(255,255,255,.08); border:none; border-radius:999px; padding:7px 14px; cursor:pointer;}
  .hf-btn.on{color:var(--ink); background:var(--amber);}
  .vbox{margin-top:16px; text-align:left; background:rgba(255,255,255,.06); border-radius:12px; padding:12px 14px;}
  .vbox label{display:block; font-size:12px; font-weight:600; color:#9AA6B5; margin-bottom:6px;}
  .vbox select{width:100%; padding:10px 12px; font-size:14px; font-family:Inter,sans-serif; color:var(--ink); background:#fff; border:none; border-radius:9px; outline:none;}
  .heard{color:#9AA6B5; font-size:13px; margin:0 0 6px;}
  .said{color:#fff; font-size:15px; font-weight:600; margin:0; display:flex; align-items:center; gap:8px;}
  .err{color:#FFB4B0; font-size:13px; margin:0;}
  input[type=range]{width:100%; accent-color:var(--amber);}
  .test-btn{margin-top:14px; display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ink); background:var(--amber); border:none; border-radius:9px; padding:9px 14px; cursor:pointer;}
  .search{position:relative; margin-bottom:18px;}
  .search .si{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .search input{width:100%; padding:16px 48px 16px 52px; font-size:17px; font-family:Inter,sans-serif; font-weight:500; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:14px; outline:none; box-shadow:0 10px 30px -18px rgba(22,32,46,.4);}
  .search input:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(200,54,47,.15);}
  .clear{position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); padding:4px;}
  .empty{text-align:center; padding:20px 16px 8px;}
  .empty p{color:var(--muted); font-size:15px; margin:12px 0 16px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .chip{font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer;}
  .nomatch{text-align:center; padding:30px 20px; background:var(--card); border-radius:14px; border:1px dashed var(--line);}
  .nomatch b{display:block; font-size:16px; margin-bottom:6px;}
  .nomatch span{color:var(--muted); font-size:14px;}
  .results{display:grid; gap:12px;}
  .sign{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 18px 40px -22px rgba(22,32,46,.45); border:1px solid var(--line); animation:drop .42s cubic-bezier(.2,.7,.3,1) both;}
  .sign .row{display:flex; align-items:stretch;}
  .marker{background:linear-gradient(180deg,var(--amber),var(--amber-deep)); color:var(--ink); min-width:104px; padding:16px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:3px solid var(--ink);}
  .marker .lbl{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.8;}
  .marker .num{font-family:Oswald,sans-serif; font-weight:700; line-height:1; text-align:center;}
  .sign .body{padding:14px 16px; flex:1; min-width:0;}
  .sign h3{margin:0; font-family:Oswald,sans-serif; font-weight:600; font-size:19px; line-height:1.15;}
  .sign .loc{display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--red); font-weight:600; font-size:13.5px;}
  .sign .loc span{color:var(--ink-soft);}
  .sign .tags{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .sign .cat{font-size:11px; font-weight:600; color:var(--muted); background:var(--surface); padding:3px 9px; border-radius:999px;}
  .sign .note{font-size:12.5px; color:var(--muted); font-style:italic;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px;}
  .panel h3{margin:0 0 14px; font-family:Oswald,sans-serif; font-size:18px;}
  .fld{display:block; margin-bottom:10px;}
  .fld span{font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px;}
  .fld .req{color:var(--red);}
  .fld input{width:100%; padding:10px 12px; font-size:14px; font-family:Inter,sans-serif; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:9px; outline:none;}
  .fld input:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(200,54,47,.15);}
  .two{display:flex; gap:10px;} .two>div{flex:1;}
  .save{flex:1; padding:12px; background:var(--red); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;}
  .cancel{padding:12px 16px; background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:10px; font-weight:600; font-size:14px; cursor:pointer;}
  .meta-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .meta-row .count{font-size:13px; font-weight:600; color:var(--muted);}
  .reset{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer;}
  .bulk{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:9px; padding:9px 12px; cursor:pointer;}
  .bulk.ghost{color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); font-weight:600;}
  .crow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .crow .ca{min-width:46px; text-align:center; font-family:Oswald,sans-serif; font-weight:700; font-size:18px; color:var(--amber-deep);}
  .crow .cn{flex:1; min-width:0;}
  .crow .cn .nm{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .crow .cn .sc{font-size:12.5px; color:var(--muted);}
  .crow .ic{background:none; border:none; cursor:pointer; padding:6px; color:var(--muted);}
  .crow .ic.del{color:var(--red);}
  .hidden{display:none !important;}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid rgba(200,54,47,.4); outline-offset:2px; border-radius:8px;}
  @keyframes drop{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,54,47,.55);} 70%{box-shadow:0 0 0 18px rgba(200,54,47,0);}}
  @media (prefers-reduced-motion: reduce){.sign,.mic.live{animation:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><h1>Aisle Finder</h1><p>Find any product, fast</p></div>
    </div>
    <button class="mode-btn" id="modeBtn"></button>
  </header>

  <!-- CUSTOMER VIEW -->
  <div id="customerView">
    <div class="voice-panel">
      <div class="toggles">
        <button class="tg" id="settingsToggle" title="Voice & speed"></button>
        <button class="tg" id="muteToggle" title="Spoken answers"></button>
      </div>
      <button class="mic" id="micBtn"></button>
      <p class="vp-title" id="vpTitle">Tap and ask</p>
      <p class="vp-sub" id="vpSub">e.g. “Hi Tally, where's the beer?”</p>
      <button class="hf-btn" id="hfBtn">Turn on hands-free listening</button>
      <div class="vbox hidden" id="voiceSettings">
        <label>Tally's voice</label>
        <select id="voiceSelect"><option value="">Browser default</option></select>
        <p id="noVoices" class="vp-sub hidden" style="margin-top:8px;">No selectable voices on this browser — the default voice will be used.</p>
        <label style="display:flex; justify-content:space-between; margin:16px 0 6px;"><span>Speaking speed</span><span id="rateLabel" style="color:var(--amber);">1.0×</span></label>
        <input type="range" id="rateRange" min="0.6" max="1.6" step="0.1" value="1" />
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#8C97A6; margin-top:2px;"><span>Slower</span><span>Faster</span></div>
        <button class="test-btn" id="testBtn"></button>
      </div>
      <div class="vbox hidden" id="voiceFeedback"></div>
    </div>

    <div class="search">
      <span class="si" id="searchIcon"></span>
      <input id="searchInput" placeholder="…or type a product name" aria-label="Search for a product" />
      <button class="clear hidden" id="clearBtn" aria-label="Clear search"></button>
    </div>

    <div id="results"></div>
  </div>

  <!-- STAFF VIEW -->
  <div id="staffView" class="hidden">
    <div class="panel">
      <h3 id="formTitle">Add a product</h3>
      <label class="fld"><span>Product name <b class="req">*</b></span><input id="f_name" placeholder="e.g. Paper Towels (12-pack)" /></label>
      <div class="two">
        <div><label class="fld"><span>Aisle <b class="req">*</b></span><input id="f_aisle" placeholder="e.g. 10" /></label></div>
        <div><label class="fld"><span>Category</span><input id="f_category" placeholder="e.g. Paper Goods" /></label></div>
      </div>
      <label class="fld"><span>Where in the aisle</span><input id="f_section" placeholder="e.g. Right side, bay 3" /></label>
      <label class="fld"><span>Note (optional)</span><input id="f_note" placeholder="e.g. Bottom pallet" /></label>
      <label class="fld"><span>Search keywords (optional)</span><input id="f_keywords" placeholder="e.g. tp toilet roll charmin" /></label>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="save" id="saveBtn"></button>
        <button class="cancel hidden" id="cancelBtn">Cancel</button>
      </div>
    </div>
    <div class="panel" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <div>
          <div style="font-family:Oswald,sans-serif; font-size:15px;">Bulk tools</div>
          <div style="font-size:12px; color:var(--muted);">Load or back up your whole list as a spreadsheet (CSV).</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="bulk" id="importBtn"></button>
          <button class="bulk ghost" id="templateBtn"></button>
          <button class="bulk ghost" id="exportBtn"></button>
        </div>
      </div>
      <p id="importMsg" class="hidden" style="margin:10px 0 0; font-size:13px; font-weight:600; color:var(--ink-soft);"></p>
      <input type="file" id="fileInput" accept=".csv,text/csv" class="hidden" />
    </div>

    <div class="meta-row">
      <span class="count" id="catCount"></span>
      <button class="reset" id="resetBtn"></button>
    </div>
    <div id="catalogList"></div>
  </div>
</div>

  {id:20,name:"Rotisserie Chicken",category:"Deli",keywords:"cooked hot",aisle:"Deli",section:"Front-left, hot case",note:"Near the entrance"},
  {id:21,name:"Bananas & Produce",category:"Produce",keywords:"fruit vegetables apples",aisle:"1",section:"Front-right",note:""},
  {id:22,name:"Bread & Bakery",category:"Bakery",keywords:"bagels muffins rolls",aisle:"2",section:"Front-center",note:""},
  {id:23,name:"Televisions & Electronics",category:"Electronics",keywords:"tv laptop headphones",aisle:"E1",section:"Back-left showroom",note:"Ask an associate for boxed stock"},
  {id:24,name:"Tires & Auto",category:"Auto",keywords:"wheels battery wiper",aisle:"Auto Center",section:"Far-left, outside entrance",note:"Separate service desk"}
];

/* ---------- helpers ---------- */
const norm = s => (s||"").toLowerCase().trim();
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

// Words that carry no product meaning — ignored when matching.
const STOP = new Set(["where","wheres","is","are","the","a","an","some","any","this","that",
  "i","im","me","my","we","you","your","do","does","did","can","could","would","will",
  "find","finding","look","looking","locate","located","location","get","got","need","want",
  "for","of","to","in","at","on","near","by","please","what","which","whats","aisle",
  "hi","hey","hello","ok","okay","yo","tally","there","theres","it","and","or"]);
const tokensOf = s => norm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
const contentTokens = s => tokensOf(s).filter(w => w.length>1 && !STOP.has(w));

function scoreMatch(item, q){
  const query=norm(q); if(!query) return 0;
  const name=norm(item.name), cat=norm(item.category), kw=norm(item.keywords);
  const hay = `${name} ${cat} ${kw}`;
  if(name===query) return 100;
  if(name.startsWith(query)) return 85;
  if(name.includes(query)) return 70;
  // meaningful-word overlap: works even if filler like "where is" survives
  const qt = contentTokens(query);
  if(qt.length){
    let hit=0;
    for(const w of qt){
      const singular = w.endsWith("s") ? w.slice(0,-1) : null;
      if(hay.includes(w) || (singular && singular.length>2 && hay.includes(singular)) || hay.includes(w+"s")) hit++;
    }
    if(hit===qt.length) return 60;
    if(hit>0) return 28 + hit*6;
  }
  if(cat.includes(query)) return 40;
  if(kw.includes(query)) return 25;
  return 0;
}
function parseQuery(text){
  let t=" "+(text||"").toLowerCase()+" ";
  const strip=["hi tally","hey tally","hello tally","ok tally","okay tally","yo tally",
    "tally","talley","tallie","talli","tali","taly","tallly","telly","tilly","terry","teri",
    "where is the","where is","where's the","where's","where are the","where are",
    "where can i find the","where can i find","can i find","i am looking for","i'm looking for",
    "looking for","do you have any","do you have","find me the","find me","find the","find",
    "located","location of the","location of","what aisle is","what aisle","please"];
  for(const s of strip) t=t.split(s).join(" ");
  t=t.replace(/[?.!,]/g,"").replace(/\b(the|a|an|some|any)\b/g," ");
  return t.replace(/\s+/g," ").trim();
}
// What counts as the "Tally" wake word, including common mis-hearings.
const WAKE=/\b(tally|talley|tallie|talli|tali|taly|tallly|telly|tilly|terry|teri)\b/i;
// A leading greeting also activates it ("Hi Tally…" works even if the name is misheard).
const GREET=/^\s*(hi|hey|hello|hiya|yo|ok|okay)\b/i;
function spokenLocation(item){ const a=item.aisle.trim(); return /\d/.test(a)?`at Aisle ${a}`:`in the ${a}`; }

/* ---------- state ---------- */
let catalog = [];
let mode = "customer";
let voiceOn = true, rate = 1, voiceURI = "";
let editingId = null;
let listening = false, handsFree = false;
let rec = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const supported = !!SR;

function loadCatalog(){
  const raw = store.get("catalog");
  if(raw){ try{ catalog = JSON.parse(raw); return; }catch{} }
  catalog = SEED.slice();
  store.set("catalog", JSON.stringify(catalog));
}
function saveCatalog(){ store.set("catalog", JSON.stringify(catalog)); }
function loadPrefs(){
  const raw = store.get("voicePrefs");
  if(raw){ try{ const p=JSON.parse(raw);
    if(typeof p.rate==="number") rate=p.rate;
    if(typeof p.voiceURI==="string") voiceURI=p.voiceURI;
    if(typeof p.voiceOn==="boolean") voiceOn=p.voiceOn;
  }catch{} }
}
function savePrefs(){ store.set("voicePrefs", JSON.stringify({rate,voiceURI,voiceOn})); }

/* ---------- speech ---------- */
function speak(text){
  if(!voiceOn) return;
  try{
    const s=window.speechSynthesis; if(!s) return;
    s.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=rate||1; u.pitch=1;
    if(voiceURI){ const v=(s.getVoices()||[]).find(x=>x.voiceURI===voiceURI); if(v) u.voice=v; }
    s.speak(u);
  }catch{}
}
function ensureRec(){
  if(rec) return rec;
  if(!SR) return null;
  rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=e=>handleTranscript(e.results[e.results.length-1][0].transcript);
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      showFeedback({err:"Microphone is blocked. Allow mic access in your browser, or open this app in its own tab."});
      handsFree=false; updateHF();
    }
    setListening(false);
  };
  rec.onend=()=>{ if(handsFree){ try{rec.start();}catch{} } else setListening(false); };
  return rec;
}
function handleTranscript(txt){
  const raw = txt || "";
  if(handsFree && !WAKE.test(raw) && !GREET.test(raw)){ showFeedback({heard:raw}); return; }
  // strip a leading greeting plus the assistant-name word that follows it (e.g. "hi terry")
  const cleaned = raw.replace(/^\s*(hi|hey|hello|hiya|yo|ok|okay)\b\s*[a-z']*/i, " ");
  const query = parseQuery(cleaned);
  showFeedback({heard:raw});
  if(query) respond(query);
}
function respond(query){
  const input=document.getElementById("searchInput");
  input.value=query;
  document.getElementById("clearBtn").classList.toggle("hidden", !query);
  renderResults(query);
  const top=catalog.map(it=>({it,s:scoreMatch(it,query)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s)[0];
  // a clean subject for the spoken reply (drop filler words)
  const subject = cap(contentTokens(query).join(" ") || query);
  let line;
  if(!top) line=`Sorry, I couldn't find ${subject}. A team member in a red vest can help.`;
  else line=`${subject} is ${spokenLocation(top.it)}`+(top.it.section?`, ${top.it.section}.`:".");
  showFeedback({heard: input._lastHeard, answer:line});
  speak(line);
}

/* ---------- rendering ---------- */
function setListening(on){
  listening=on;
  const m=document.getElementById("micBtn");
  m.classList.toggle("live", on);
  document.getElementById("vpTitle").textContent = !supported ? "Voice needs Chrome or Edge" : (on ? "Listening…" : "Tap and ask");
}
function updateHF(){
  const b=document.getElementById("hfBtn");
  b.classList.toggle("on", handsFree);
  b.textContent = handsFree ? "Hands-free is ON — say “Tally…”" : "Turn on hands-free listening";
}
function showFeedback({heard, answer, err}={}){
  const box=document.getElementById("voiceFeedback");
  const input=document.getElementById("searchInput");
  if(heard!==undefined) input._lastHeard=heard;
  const h=input._lastHeard;
  let html="";
  if(err) html=`<p class="err">${esc(err)}</p>`;
  else{
    if(h) html+=`<p class="heard">You said: “${esc(h)}”</p>`;
    if(answer) html+=`<p class="said">${svg(I.vol,16,'#FFC02E')} ${esc(answer)}</p>`;
  }
  box.innerHTML=html;
  box.classList.toggle("hidden", !html);
}
function aisleSign(it){
  const big = it.aisle.length>3 ? 22 : 42;
  return `<div class="sign"><div class="row">
    <div class="marker"><span class="lbl">Aisle</span><span class="num" style="font-size:${big}px">${esc(it.aisle)}</span></div>
    <div class="body">
      <h3>${esc(it.name)}</h3>
      <div class="loc">${svg(I.pin,15,'#C8362F',2.4)}<span>${esc(it.section||"In aisle")}</span></div>
      <div class="tags"><span class="cat">${esc(it.category||"")}</span>${it.note?`<span class="note">${esc(it.note)}</span>`:""}</div>
    </div></div></div>`;
}
function renderResults(query){
  const wrap=document.getElementById("results");
  if(!norm(query)){
    const cats=[...new Set(catalog.map(c=>c.category))].slice(0,8);
    wrap.innerHTML=`<div class="empty">${svg(I.pkg,42,'#D8DCE2',1.6)}
      <p>Ask out loud or type — we'll point you to the aisle.</p>
      <div class="chips">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>`;
    return;
  }
  const res=catalog.map(it=>({it,s:scoreMatch(it,query)})).filter(r=>r.s>0)
    .sort((a,b)=>b.s-a.s||a.it.name.localeCompare(b.it.name)).map(r=>r.it);
  if(res.length===0){
    wrap.innerHTML=`<div class="nomatch"><b>No match for “${esc(query)}”</b>
      <span>Try a simpler word, or ask any team member in a red vest to help.</span></div>`;
    return;
  }
  wrap.innerHTML=`<div class="results">${res.map(aisleSign).join("")}</div>`;
}
function renderVoices(){
  const sel=document.getElementById("voiceSelect");
  const s=window.speechSynthesis;
  let voices = s ? (s.getVoices()||[]) : [];
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const list=(en.length?en:voices).slice().sort((a,b)=>a.name.localeCompare(b.name));
  sel.innerHTML=`<option value="">Browser default</option>`+
    list.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  sel.value=voiceURI;
  document.getElementById("noVoices").classList.toggle("hidden", list.length>0);
}
function renderStaff(){
  document.getElementById("catCount").textContent=`${catalog.length} products in catalog`;
  const list=document.getElementById("catalogList");
  list.innerHTML=catalog.map(it=>`<div class="crow">
    <div class="ca">${esc(it.aisle)}</div>
    <div class="cn"><div class="nm">${esc(it.name)}</div><div class="sc">${esc(it.section||it.category||"")}</div></div>
    <button class="ic" data-edit="${it.id}" aria-label="Edit">${svg(I.pencil,17)}</button>
    <button class="ic del" data-del="${it.id}" aria-label="Delete">${svg(I.trash,17)}</button>
  </div>`).join("");
}
function setMode(m){
  mode=m;
  document.getElementById("customerView").classList.toggle("hidden", m!=="customer");
  document.getElementById("staffView").classList.toggle("hidden", m!=="staff");
  const btn=document.getElementById("modeBtn");
  btn.innerHTML = m==="customer" ? `${svg(I.gear,16)} Staff` : `${svg(I.back,16)} Search`;
  if(m==="staff") renderStaff();
}

/* ---------- form ---------- */
function readForm(){ return {
  name:document.getElementById("f_name").value,
  aisle:document.getElementById("f_aisle").value,
  category:document.getElementById("f_category").value,
  section:document.getElementById("f_section").value,
  note:document.getElementById("f_note").value,
  keywords:document.getElementById("f_keywords").value
};}
function fillForm(it){
  document.getElementById("f_name").value=it.name||"";
  document.getElementById("f_aisle").value=it.aisle||"";
  document.getElementById("f_category").value=it.category||"";
  document.getElementById("f_section").value=it.section||"";
  document.getElementById("f_note").value=it.note||"";
  document.getElementById("f_keywords").value=it.keywords||"";
}
function clearForm(){ fillForm({}); editingId=null;
  document.getElementById("formTitle").textContent="Add a product";
  document.getElementById("cancelBtn").classList.add("hidden");
  document.getElementById("saveBtn").innerHTML=`${svg(I.plus,17)} Add product`;
}

/* ---------- CSV import / export ---------- */
function parseCSV(text){
  const rows=[]; let i=0, field="", row=[], inQ=false;
  text=text.replace(/^\uFEFF/,""); // strip BOM
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"'; i+=2; continue;} inQ=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
    field+=c; i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
const HEADER_MAP={name:"name",product:"name",item:"name","product name":"name",
  aisle:"aisle","aisle #":"aisle","aisle number":"aisle",
  category:"category",dept:"category",department:"category",
  section:"section",location:"section",where:"section","where in aisle":"section","where in the aisle":"section",
  note:"note",notes:"note",
  keywords:"keywords",keyword:"keywords",synonyms:"keywords",aliases:"keywords"};
function importCatalogRows(rows){
  rows=(rows||[]).filter(r=>r.some(c=>(c||"").trim()!==""));
  if(!rows.length) return {added:0,updated:0,skipped:0};
  const first=rows[0].map(c=>(c||"").trim().toLowerCase());
  const hasHeader=first.some(c=>HEADER_MAP[c]);
  let map, dataRows;
  if(hasHeader){ map={}; first.forEach((c,idx)=>{ if(HEADER_MAP[c]&&map[HEADER_MAP[c]]==null) map[HEADER_MAP[c]]=idx; }); dataRows=rows.slice(1); }
  else { map={name:0,aisle:1,category:2,section:3,note:4,keywords:5}; dataRows=rows; }
  let added=0,updated=0,skipped=0,maxId=catalog.reduce((m,c)=>Math.max(m,c.id),0);
  dataRows.forEach(r=>{
    const get=k=> map[k]!=null ? (r[map[k]]||"").trim() : "";
    const name=get("name"), aisle=get("aisle");
    if(!name||!aisle){ skipped++; return; }
    const obj={name,aisle,category:get("category"),section:get("section"),note:get("note"),keywords:get("keywords")};
    const existing=catalog.find(c=>norm(c.name)===norm(name));
    if(existing){ Object.assign(existing,obj); updated++; }
    else { catalog.push({...obj,id:++maxId}); added++; }
  });
  saveCatalog();
  return {added,updated,skipped};
}
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function catalogToCSV(){
  const head=["name","aisle","category","section","note","keywords"];
  return [head.join(",")].concat(catalog.map(it=>head.map(h=>csvCell(it[h])).join(","))).join("\r\n");
}
function templateCSV(){
  return ["name,aisle,category,section,note,keywords",
    'Paper Towels (12-pack),10,Paper Goods,"Right side, bays 3-4",Bottom pallet,kitchen roll bounty',
    "Bananas & Produce,1,Produce,Front-right,,fruit apples"].join("\r\n");
}
function downloadFile(name,text){
  try{
    const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
  }catch(e){ showImportMsg("Couldn't create the file in this browser."); }
}
function showImportMsg(t){ const el=document.getElementById("importMsg"); el.textContent=t; el.classList.remove("hidden"); }

/* ---------- wire up ---------- */
function init(){
  loadCatalog(); loadPrefs();

  document.getElementById("logo").innerHTML=svg(I.pin,22,'#fff',2.4);
  document.getElementById("searchIcon").innerHTML=svg(I.search,22,'#6A7686');
  document.getElementById("clearBtn").innerHTML=svg(I.x,20);
  document.getElementById("micBtn").innerHTML=svg(I.mic,36,null,2.2);
  document.getElementById("settingsToggle").innerHTML=svg(I.sliders,17);
  document.getElementById("testBtn").innerHTML=`${svg(I.play,15)} Test voice`;
  document.getElementById("resetBtn").innerHTML=`${svg(I.reset,14)} Reset to sample data`;
  document.getElementById("importBtn").innerHTML=`${svg(I.upload,15)} Import CSV`;
  document.getElementById("templateBtn").innerHTML=`${svg(I.file,15)} Template`;
  document.getElementById("exportBtn").innerHTML=`${svg(I.download,15)} Export CSV`;
  clearForm();
  setMode("customer");
  if(!supported){
    document.getElementById("micBtn").disabled=true;
    document.getElementById("vpTitle").textContent="Voice needs Chrome or Edge";
    document.getElementById("vpSub").textContent="You can still type your search below.";
    document.getElementById("hfBtn").classList.add("hidden");
  }
  updateMute(); updateHF(); renderResults("");

  // rate + voice controls
  document.getElementById("rateRange").value=rate;
  document.getElementById("rateLabel").textContent=rate.toFixed(1)+"×";
  renderVoices();
  if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=renderVoices;

  // events
  const input=document.getElementById("searchInput");
  input.addEventListener("input", e=>{
    const v=e.target.value;
    document.getElementById("clearBtn").classList.toggle("hidden", !v);
    document.getElementById("voiceFeedback").classList.add("hidden");
    renderResults(v);
  });
  document.getElementById("clearBtn").addEventListener("click", ()=>{
    input.value=""; document.getElementById("clearBtn").classList.add("hidden");
    document.getElementById("voiceFeedback").classList.add("hidden");
    input._lastHeard=""; renderResults("");
  });
  document.getElementById("results").addEventListener("click", e=>{
    const chip=e.target.closest("[data-cat]");
    if(chip){ input.value=chip.dataset.cat; document.getElementById("clearBtn").classList.remove("hidden"); renderResults(chip.dataset.cat); }
  });

  document.getElementById("micBtn").addEventListener("click", ()=>{
    if(!supported) return;
    showFeedback({}); input._lastHeard="";
    const r=ensureRec(); if(!r) return;
    if(listening){ try{r.stop();}catch{} return; }
    try{ setListening(true); r.start(); }catch{}
  });
  document.getElementById("hfBtn").addEventListener("click", ()=>{
    handsFree=!handsFree; updateHF();
    const r=ensureRec(); if(!r) return;
    if(handsFree){ try{ setListening(true); r.start(); }catch{} speak("Hands-free is on. Just say, Hi Tally, then your product."); }
    else{ try{r.stop();}catch{} setListening(false); }
  });
  document.getElementById("muteToggle").addEventListener("click", ()=>{ voiceOn=!voiceOn; updateMute(); savePrefs(); });
  document.getElementById("settingsToggle").addEventListener("click", ()=>{
    const p=document.getElementById("voiceSettings"); const open=p.classList.toggle("hidden")===false;
    document.getElementById("settingsToggle").style.background=open?"var(--amber)":"rgba(255,255,255,.08)";
    document.getElementById("settingsToggle").style.color=open?"var(--ink)":"#cfd6df";
    if(open) renderVoices();
  });
  document.getElementById("voiceSelect").addEventListener("change", e=>{ voiceURI=e.target.value; savePrefs(); });
  document.getElementById("rateRange").addEventListener("input", e=>{
    rate=parseFloat(e.target.value);
    document.getElementById("rateLabel").textContent=rate.toFixed(1)+"×"; savePrefs();
  });
  document.getElementById("testBtn").addEventListener("click", ()=>speak("Beer is at Aisle 5, right side."));

  document.getElementById("modeBtn").addEventListener("click", ()=>setMode(mode==="customer"?"staff":"customer"));

  document.getElementById("saveBtn").addEventListener("click", ()=>{
    const f=readForm();
    if(!norm(f.name)||!norm(f.aisle)) return;
    if(editingId!=null){ catalog=catalog.map(c=>c.id===editingId?{...f,id:editingId}:c); }
    else{ const id=catalog.reduce((m,c)=>Math.max(m,c.id),0)+1; catalog=[...catalog,{...f,id}]; }
    saveCatalog(); clearForm(); renderStaff();
  });
  document.getElementById("cancelBtn").addEventListener("click", clearForm);
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    catalog=SEED.slice(); saveCatalog(); clearForm(); renderStaff();
    showImportMsg("Catalog reset to the sample products.");
  });
  document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const r=importCatalogRows(parseCSV(String(reader.result)));
        renderStaff();
        showImportMsg(`Imported: ${r.added} new, ${r.updated} updated${r.skipped?`, ${r.skipped} skipped (missing name or aisle)`:""}.`);
      }catch(err){ showImportMsg("Couldn't read that file. Make sure it's a CSV with a name and aisle column."); }
      e.target.value="";
    };
    reader.onerror=()=>{ showImportMsg("Couldn't open that file."); e.target.value=""; };
    reader.readAsText(file);
  });
  document.getElementById("templateBtn").addEventListener("click", ()=>downloadFile("aisle-finder-template.csv", templateCSV()));
  document.getElementById("exportBtn").addEventListener("click", ()=>downloadFile("aisle-finder-catalog.csv", catalogToCSV()));
  document.getElementById("catalogList").addEventListener("click", e=>{
    const ed=e.target.closest("[data-edit]"); const del=e.target.closest("[data-del]");
    if(ed){ const it=catalog.find(c=>c.id==ed.dataset.edit); if(it){ editingId=it.id; fillForm(it);
      document.getElementById("formTitle").textContent="Edit product";
      document.getElementById("cancelBtn").classList.remove("hidden");
      document.getElementById("saveBtn").innerHTML=`${svg(I.plus,17)} Save changes`;
      window.scrollTo({top:0,behavior:"smooth"}); } }
    if(del){ catalog=catalog.filter(c=>c.id!=del.dataset.del); saveCatalog();
      if(editingId==del.dataset.del) clearForm(); renderStaff(); }
  });

  window.addEventListener("beforeunload", ()=>{ try{rec&&rec.stop();}catch{} try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch{} });
}
function updateMute(){
  const b=document.getElementById("muteToggle");
  b.innerHTML=svg(voiceOn?I.vol:I.volx,17);
  b.style.color=voiceOn?"#FFC02E":"#8C97A6";
}
document.addEventListener("DOMContentLoaded", init);

/* ---------- offline support (works when hosted alongside sw.js over https) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* not hosted / file:// — app still works online */ });
  });
}
